  <title id="t">JSON braces on a folded page</title>
  <!-- Original mark: a page with a folded corner holding a pair of JSON braces.
       Colours are deliberately NOT Google's (#4285F4 #EA4335 #FBBC05 #34A853)
       nor JSON Resume's (#FFF18F). Background is transparent (Marketplace icon rule).
       Geometry follows the Google Workspace product-icon grid, measured on the official
       Docs icon (gstatic docs_2020q4_48dp): page 32x44 on a 48 canvas = aspect 8:11,
       91.7% of the height, centred (16.7% side, 4.2% top/bottom margins). Scaled to 128:
       page x 21.33-106.67, y 5.33-122.67. Shape and colours stay our own. -->
