name: CI

# Lands through the shared system (kattakath/.github): `gate` is the one check the
# shared ruleset requires. This repo is Tier B (personal account, no merge queue), so the
# heavy leg's if: is always true here; it is copied verbatim so the file is homogeneous
# with Tier A repos and needs no edit if the repo ever moves to an organisation.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read # no secrets in CI: a merge_group run executes fork code in base-repo context

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; push, queue and dispatch runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint-format-test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate src/appsscript.json
        run: node -e 'JSON.parse(require("fs").readFileSync("src/appsscript.json", "utf8"))'

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  dco:
    name: dco
    # PR-only: it reads the PR's base and head SHAs, which no other event carries.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit has a matching Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Developer Certificate of Origin (https://developercertificate.org/): the trailer
        # must name the commit author, as `git commit -s` writes it. Bot commits
        # (release-please via the CI App, Dependabot) carry no sign-off and are exempt.
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name=$(git log -1 --format='%an' "$c"); email=$(git log -1 --format='%ae' "$c")
            case "$email" in *'[bot]@users.noreply.github.com') echo "skip bot $c"; continue;; esac
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "$name <$email>"; then
              echo "ok   $c"
            else
              echo "::error::commit $c has no 'Signed-off-by: $name <$email>' (use git commit -s)"; fail=1
            fi
          done
          exit "$fail"

  gate:
    name: gate
    # THE ONLY REQUIRED CHECK under the shared ruleset; never rename it.
    if: ${{ !cancelled() }}
    needs: [ci, dco]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: kattakath/.github/actions/gate@3d5ad5b9e04c853dbb0d82446255c9ef9230332a
        with:
          needs: ${{ toJSON(needs) }}
          # Keys are job IDs. A deliberate second copy of each leg's if:; if a copy drifts,
          # gate goes red.
          expect: >-
            {"ci": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }},
             "dco": ${{ github.event_name == 'pull_request' }}}
