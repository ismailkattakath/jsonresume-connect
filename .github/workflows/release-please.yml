name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # changelog commit, tag, GitHub release
      issues: write # create/apply "autorelease: pending" labels
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The owner's CI GitHub App (same pinned action and names as kattakath/nix-config's
      # auto-merge.yml). Release PRs pushed with GITHUB_TOKEN are held as "action_required"
      # until someone approves each run; PRs pushed as the App run their checks at once.
      # Skipped when the App is not configured; the next step then demands RELEASE_PLEASE_TOKEN.
      - id: app-token
        if: ${{ vars.CI_BOT_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] -- an environment reviewer would gate every push to main
          repositories: ${{ github.event.repository.name }}
          # Exactly the job's own permissions above; the App's installation grants more.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # Fail loudly, never fall back to GITHUB_TOKEN: a release PR it opens starts no CI, so
      # it can never pass the required `gate` check and sits BLOCKED with no error anywhere.
      - name: Require a token whose release PRs run CI
        if: ${{ steps.app-token.outputs.token == '' }}
        env:
          HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }} # zizmor: ignore[secrets-outside-env] -- a boolean, never the value
        run: |
          if [ "$HAS_PAT" != true ]; then
            echo "::error title=release-please::set CI_BOT_CLIENT_ID + CI_BOT_APP_PRIVATE_KEY (or RELEASE_PLEASE_TOKEN); see .github/RELEASING.md"
            exit 1
          fi
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # App token, else a fine-grained PAT; no GITHUB_TOKEN fallback (see .github/RELEASING.md).
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN }} # zizmor: ignore[secrets-outside-env] -- an environment reviewer would gate every push to main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: deploy
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    # ./ not $/: zizmor 1.31 prefers the July-2026 "$/" self-repository form, but
    # actionlint 1.7.12 rejects it; keep the documented form until actionlint accepts it.
    uses: ./.github/workflows/deploy.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    # These live in the production environment. A caller may pass an environment-only
    # secret by name; deploy.yml's job sets `environment`, so it receives the environment
    # value (GitHub docs, "Reuse workflows" > environment secrets).
    secrets:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
