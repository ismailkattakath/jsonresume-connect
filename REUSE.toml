version = 1

[[annotations]]
path = "src/third_party/apps-script-oauth2/**"
precedence = "override"
SPDX-FileCopyrightText = "2014 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**/*.md", "**/*.json", "**/*.yml", "**/*.yaml", "assets/**", "docs/**", ".github/**", ".nvmrc", ".clasp.json.example", ".envrc", ".envrc.local.example", "flake.nix", "flake.lock", ".gitignore", ".gitattributes", ".editorconfig", ".prettierignore", ".prettierrc.json", "LICENSE", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ismail Kattakath"
SPDX-License-Identifier = "MIT"

# The mark is the JSON Resume project's, made for this app and used with permission
# (assets/README.md). Upstream's repo is MIT and gives the files no separate licence.
[[annotations]]
path = ["assets/logo.svg", "assets/src/logo.svg", "assets/icon-*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2026 JSON Resume contributors"
SPDX-License-Identifier = "MIT"

# The banner places that mark on our background.
[[annotations]]
path = ["assets/src/banner.svg", "assets/card-banner-220x140.png"]
precedence = "override"
SPDX-FileCopyrightText = ["2014-2026 JSON Resume contributors", "2026 Ismail Kattakath"]
SPDX-License-Identifier = "MIT"

# Screenshots of Google Workspace Studio: Google's interface, not ours to MIT-license.
# Last on purpose: when several annotations match a file, the last one wins.
[[annotations]]
path = "assets/screenshots/**"
precedence = "override"
SPDX-FileCopyrightText = ["Google LLC", "2026 Ismail Kattakath"]
SPDX-License-Identifier = "LicenseRef-Google-Screenshot"
